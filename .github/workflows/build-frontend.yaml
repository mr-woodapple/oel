# Reusable workflow to build the Oel frontend project.
name: Oel Frontend Build

env:
  FE_LOCATION: './src/oel.frontend/'
  NODE_VERSION: '24'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    name: Build frontend
    defaults:
      run:
        working-directory: ${{ env.FE_LOCATION }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FE_LOCATION }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm build
        run: npm run build
