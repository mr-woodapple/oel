# Reusable workflow to build and publish the Oel container image.

name: Publish Docker Image

on:
  workflow_call:
    inputs:
      stage:
        description: "Image tag strategy to use (dev, release, or version)"
        required: true
        type: string
      tag_suffix:
        description: "Optional suffix to append as a separate tag for dev builds"
        required: false
        default: ""
        type: string
      version:
        description: "Semantic version to publish when stage is version (without a leading v)"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Assemble tags (for PRs it's :dev and :pr-<pull-request-number>).
      - name: Compose image tags
        id: tags
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          IMAGE_BASE="${IMAGE_BASE,,}"

          case "$STAGE" in
            dev)
              TAGS="$IMAGE_BASE:dev"

              if [ -n "$TAG_SUFFIX" ]; then
                TAGS="$TAGS,$IMAGE_BASE:$TAG_SUFFIX"
              else
                TAGS="$TAGS,$IMAGE_BASE:pr-${{ github.event.number }}"
              fi
              ;;
            release)
              TAGS="$IMAGE_BASE:release"
              ;;
            version)
              SEMVER_PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

              if [[ ! "$VERSION" =~ $SEMVER_PATTERN ]]; then
                echo "Version '$VERSION' is not a supported semantic version."
                exit 1
              fi

              TAGS="$IMAGE_BASE:$VERSION"

              if [[ "$VERSION" != *-* ]]; then
                IFS='.' read -r MAJOR MINOR_PATCH <<< "$VERSION"
                MINOR="${MINOR_PATCH%%.*}"
                TAGS="$TAGS,$IMAGE_BASE:$MAJOR.$MINOR,$IMAGE_BASE:$MAJOR,$IMAGE_BASE:latest"
              fi
              ;;
            *)
              echo "Unsupported stage: $STAGE"
              exit 1
              ;;
          esac

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Oel Image
        id: push-oel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
