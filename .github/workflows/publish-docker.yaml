# Reusable workflow to build and publish container images.

name: Publish Docker Images

on:
  workflow_call:
    inputs:
      stage:
        description: "Image tag strategy to use (dev, release, or version)"
        required: true
        type: string
      tag_suffix:
        description: "Optional suffix to append as a separate tag for dev builds"
        required: false
        default: ""
        type: string
      version:
        description: "Semantic version to publish when stage is version (without a leading v)"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  FE_IMAGE_NAME: biteboard-frontend
  BE_IMAGE_NAME: biteboard-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Assemble tags (for PRs it's :dev and :pr-<pull-request-number>)
      - name: Compose image tags
        id: tags
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          FE_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FE_IMAGE_NAME }}"
          BE_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BE_IMAGE_NAME }}"

          case "$STAGE" in
            dev)
              FE_TAGS="$FE_BASE:dev"
              BE_TAGS="$BE_BASE:dev"

              if [ -n "$TAG_SUFFIX" ]; then
                FE_TAGS="$FE_TAGS,$FE_BASE:$TAG_SUFFIX"
                BE_TAGS="$BE_TAGS,$BE_BASE:$TAG_SUFFIX"
              else
                FE_TAGS="$FE_TAGS,$FE_BASE:pr-${{ github.event.number }}"
                BE_TAGS="$BE_TAGS,$BE_BASE:pr-${{ github.event.number }}"
              fi
              ;;
            release)
              FE_TAGS="$FE_BASE:release"
              BE_TAGS="$BE_BASE:release"
              ;;
            version)
              SEMVER_PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

              if [[ ! "$VERSION" =~ $SEMVER_PATTERN ]]; then
                echo "Version '$VERSION' is not a supported semantic version."
                exit 1
              fi

              FE_TAGS="$FE_BASE:$VERSION"
              BE_TAGS="$BE_BASE:$VERSION"

              if [[ "$VERSION" != *-* ]]; then
                IFS='.' read -r MAJOR MINOR_PATCH <<< "$VERSION"
                MINOR="${MINOR_PATCH%%.*}"
                FE_TAGS="$FE_TAGS,$FE_BASE:$MAJOR.$MINOR,$FE_BASE:$MAJOR,$FE_BASE:latest"
                BE_TAGS="$BE_TAGS,$BE_BASE:$MAJOR.$MINOR,$BE_BASE:$MAJOR,$BE_BASE:latest"
              fi
              ;;
            *)
              echo "Unsupported stage: $STAGE"
              exit 1
              ;;
          esac

          echo "fe_tags=$FE_TAGS" >> "$GITHUB_OUTPUT"
          echo "be_tags=$BE_TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        id: push-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./src/BiteBoard.Frontend
          file: ./src/BiteBoard.Frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.fe_tags }}

      - name: Build and Push Backend image
        id: push-backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/BiteBoard.Api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.be_tags }}
