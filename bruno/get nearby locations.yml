info:
  name: get nearby locations
  type: http
  seq: 17

http:
  method: GET
  url: "{{API_URL}}/location/nearby?latitude=48.13715&longitude=11.57612"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Requires Geoapify__ApiKey on the API server. Returns nearby named places within 1 km.
  Try latitude=91 (400), missing longitude (400), and an unconfigured API key (503).
