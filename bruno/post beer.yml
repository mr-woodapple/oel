info:
  name: post beer
  type: http
  seq: 2

http:
  method: POST
  url: "{{API_URL}}/beer"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Testbier
      - name: brewery
        type: text
        value: Testbrauerei
      - name: style
        type: text
        value: Teststyle
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  To include an optional photo, add a multipart file field named `photo`.
